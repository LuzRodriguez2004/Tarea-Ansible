- name: Instalar paquetes de Samba en openSUSE
  community.general.zypper:
    name:
      - samba
      - samba-client
    state: present

- name: Crear usuario del sistema para Samba
  ansible.builtin.user:
    name: "{{ samba_sys_user }}"
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Crear directorio compartido con máscara de permisos
  ansible.builtin.file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ samba_sys_user }}"
    group: users
    mode: '0770'

- name: Desplegar plantilla smb.conf
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Samba

- name: Configurar usuario y contraseña en la base de Samba (smbpasswd)
  ansible.builtin.shell: >
    set -o pipefail && (echo "{{ samba_user_password }}"; echo "{{ samba_user_password }}")
    | smbpasswd -s -a {{ samba_sys_user }}
  args:
    executable: /bin/bash
  changed_when: true

- name: Habilitar e iniciar servicios smb y nmb en openSUSE
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - smb
    - nmb

